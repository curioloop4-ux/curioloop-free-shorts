name: CurioLoop Daily Shorts

on:
  schedule:
    - cron: "0 23 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      shorts_count:
        description: "Number of Shorts to create today (1-10)"
        required: true
        type: number
        default: 1
      output_only:
        description: "Create MP4 files only; skip YouTube upload"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: curioloop-daily-shorts
  cancel-in-progress: false

jobs:
  create-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Create and upload Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: public
          OUTPUT_ONLY: ${{ github.event_name == 'schedule' || inputs.output_only }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          SHORTS_COUNT: ${{ github.event_name == 'workflow_dispatch' && inputs.shorts_count || 2 }}
        run: python main.py

      - name: Save generated MP4 files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curioloop-shorts-mp4
          path: work/*.mp4
          if-no-files-found: warn
          retention-days: 7
