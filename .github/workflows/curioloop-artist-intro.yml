name: CurioLoop Artist Intro

on:
  workflow_dispatch:
    inputs:
      artist:
        description: '한글 아티스트 이름으로 Drive 검색 및 자료 조사 (예: 장원영)'
        required: false
        default: ''
        type: string
      public_once:
        description: '이번 수동 실행 영상만 공개로 업로드'
        required: false
        default: false
        type: boolean
  schedule:
    # Korea Standard Time: 23:00, 02:00, 05:00 (UTC 14:00, 17:00, 20:00)
    - cron: "0 14,17,20 * * *"

permissions:
  contents: write

concurrency:
  group: curioloop-artist-intro
  cancel-in-progress: false

jobs:
  create-artist-intro:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg and subtitle renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate intro generator
        run: python -m py_compile artist_intro.py

      - name: Generate and upload one new Drive artist spotlight
        env:
          FANCAMVERSE_CLIENT_ID: ${{ secrets.FANCAMVERSE_CLIENT_ID }}
          FANCAMVERSE_CLIENT_SECRET: ${{ secrets.FANCAMVERSE_CLIENT_SECRET }}
          FANCAMVERSE_REFRESH_TOKEN: ${{ secrets.FANCAMVERSE_REFRESH_TOKEN }}
          FANCAMVERSE_DRIVE_FOLDER_ID: ${{ secrets.FANCAMVERSE_DRIVE_FOLDER_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          FANCAMVERSE_CHANNEL_BRAND: CurioLoop
          TARGET_ARTIST: ${{ inputs.artist }}
          INTRO_PUBLIC_ONCE: ${{ inputs.public_once }}
        run: python artist_intro.py

      - name: Save rendered video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curioloop-artist-intro
          path: |
            work_artist_intro/*_artist_intro.mp4
            work_artist_intro/*_research.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Persist successful upload history
        if: always()
        run: |
          if [ -f history/artist_intro_processed.json ] && ! git diff --quiet -- history/artist_intro_processed.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add history/artist_intro_processed.json
            git commit -m "Record CurioLoop artist intro publication"
            git push
          else
            echo "No artist intro history changes to persist."
          fi
