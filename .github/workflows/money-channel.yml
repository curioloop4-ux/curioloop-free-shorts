name: Youqian Research Institute Chinese Channel

on:
  workflow_dispatch:
    inputs:
      topic_mode:
        description: "Choose economy or beauty/massage Shorts"
        required: true
        type: choice
        options:
          - beauty
          - economy
        default: beauty
      content_type:
        description: "Choose Shorts or long-form documentary"
        required: true
        type: choice
        options:
          - shorts
          - longform
        default: shorts
      output_only:
        description: "Render only when true; false uploads Shorts"
        required: true
        type: boolean
        default: false
      shorts_count:
        description: "Number of Shorts to create (1-3)"
        required: true
        type: number
        default: 1
      start_short:
        description: "Start Shorts batch at this number (1-3)"
        required: true
        type: choice
        options:
          - "1"
          - "2"
          - "3"
        default: "1"
      privacy_status:
        description: "YouTube visibility when upload is enabled"
        required: true
        type: choice
        options:
          - public
          - unlisted
          - private
        default: public

permissions:
  contents: write

concurrency:
  group: money-channel-production
  cancel-in-progress: false

jobs:
  create-money-video:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg and Korean fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Validate money channel generator
        run: python -m py_compile money_channel.py

      - name: Generate Chinese money video
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          MONEY_YOUTUBE_CLIENT_ID: ${{ secrets.MONEY_YOUTUBE_CLIENT_ID }}
          MONEY_YOUTUBE_CLIENT_SECRET: ${{ secrets.MONEY_YOUTUBE_CLIENT_SECRET }}
          MONEY_YOUTUBE_REFRESH_TOKEN: ${{ secrets.MONEY_YOUTUBE_REFRESH_TOKEN }}
          MONEY_YOUTUBE_PRIVACY_STATUS: ${{ inputs.privacy_status }}
          MONEY_CONTENT_TYPE: ${{ inputs.content_type }}
          MONEY_TOPIC_MODE: ${{ inputs.topic_mode }}
          MONEY_START_SHORT: ${{ inputs.start_short }}
          MONEY_SHORTS_COUNT: ${{ inputs.shorts_count }}
          OUTPUT_ONLY: ${{ inputs.output_only }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python money_channel.py

      - name: Save generated video and script
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: money-channel-video
          path: |
            work_money/*.mp4
            work_money/*.json
            work_money/*.txt
          if-no-files-found: warn
          retention-days: 7
