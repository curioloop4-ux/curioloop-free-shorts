name: CurioLoop Daily Shorts

on:
  schedule:
    # Five daily Shorts for English-speaking audiences.
    # Targets 8 AM, 11 AM, 3 PM, 6 PM and 8 PM US Eastern during standard time.
    # GitHub cron uses UTC, so these slots shift one hour later in US daylight time.
    - cron: "0 13 * * *"
    - cron: "0 16 * * *"
    - cron: "0 20 * * *"
    - cron: "0 23 * * *"
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      shorts_count:
        description: "Number of Shorts to create today (1-10)"
        required: true
        type: number
        default: 1
      output_only:
        description: "Create MP4 files only; skip YouTube upload"
        required: true
        type: boolean
        default: false
      content_mode:
        description: "Choose the next Short topic style"
        required: true
        type: choice
        options:
          - animal_comedy
          - fitness_recovery
          - mixed
          - beauty
          - general
        default: mixed

permissions:
  contents: write

concurrency:
  group: curioloop-daily-shorts
  cancel-in-progress: false

jobs:
  create-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-montserrat

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Validate Python scripts
        run: python -m py_compile main.py discover_trending.py

      - name: Create and upload Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: public
          OUTPUT_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.output_only }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          CONTENT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.content_mode || 'mixed' }}
          SHORTS_COUNT: ${{ github.event_name == 'workflow_dispatch' && inputs.shorts_count || 1 }}
        run: python main.py

      - name: Save generated MP4 files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curioloop-shorts-mp4
          path: |
            work/*.mp4
            work/visual_credits.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Persist visual deduplication history
        if: always()
        run: |
          if { [ -f history/used_visuals.json ] || [ -f history/used_scripts.json ]; } && ! git diff --quiet -- history/used_visuals.json history/used_scripts.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add history/used_visuals.json history/used_scripts.json
            git commit -m "Update used visual asset history"
            git push
          else
            echo "No visual history changes to persist."
          fi
