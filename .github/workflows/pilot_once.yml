name: CurioLoop One-Time Dating Culture Pilot

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pilot_once.yml"

permissions:
  contents: read

jobs:
  create-pilot:
    if: github.event.head_commit.message == 'Run one CurioLoop pilot'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg and OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-montserrat tesseract-ocr

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Validate Python scripts
        run: python -m py_compile main.py discover_trending.py

      - name: Generate one MP4 only (no YouTube upload)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          OUTPUT_ONLY: "true"
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          CONTENT_MODE: dating_attraction
          SHORTS_COUNT: "1"
        run: python main.py

      - name: Save generated MP4 and source credits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curioloop-dating-culture-pilot
          path: |
            work/*.mp4
            work/visual_credits.txt
          if-no-files-found: error
          retention-days: 7
