name: MoneyKnowHow Korean Channel

on:
  workflow_dispatch:
    inputs:
      content_type:
        description: "Choose Shorts or long-form documentary"
        required: true
        type: choice
        options:
          - shorts
          - longform
        default: shorts
      output_only:
        description: "Render MP4 only; skip YouTube upload (recommended for first test)"
        required: true
        type: boolean
        default: true
      privacy_status:
        description: "YouTube visibility when upload is enabled"
        required: true
        type: choice
        options:
          - unlisted
          - private
          - public
        default: unlisted

permissions:
  contents: read

concurrency:
  group: money-channel-production
  cancel-in-progress: false

jobs:
  create-money-video:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg and Korean fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Validate money channel generator
        run: python -m py_compile money_channel.py

      - name: Generate Korean money video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          MONEY_YOUTUBE_REFRESH_TOKEN: ${{ secrets.MONEY_YOUTUBE_REFRESH_TOKEN }}
          MONEY_YOUTUBE_PRIVACY_STATUS: ${{ inputs.privacy_status }}
          MONEY_CONTENT_TYPE: ${{ inputs.content_type }}
          OUTPUT_ONLY: ${{ inputs.output_only }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python money_channel.py

      - name: Save generated video and script
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: money-channel-video
          path: |
            work_money/*.mp4
            work_money/*.json
            work_money/*.txt
          if-no-files-found: warn
          retention-days: 7
