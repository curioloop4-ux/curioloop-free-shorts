name: Validate Shorts Automation

on:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "discover_trending.py"
      - "artist_intro.py"
      - "curioloop_fancam.py"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Python syntax
        run: python -m py_compile main.py discover_trending.py artist_intro.py curioloop_fancam.py fancamverse_artist_intro.py fancamverse_curioloop.py
