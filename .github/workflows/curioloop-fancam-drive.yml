name: CurioLoop Fancam Drive Upload

on:
  schedule:
    # Target US evening and Indonesia evening: KST 00:00, 02:00, 04:00, 10:00, 20:00.
    - cron: "0 15 * * *"
    - cron: "0 17 * * *"
    - cron: "15 17 * * *" # 02:15 KST fallback for the 02:00 slot
    - cron: "0 19 * * *"
    - cron: "0 1 * * *"
    - cron: "0 11 * * *"
  workflow_run:
    workflows: ["CurioLoop Artist Intro"]
    types: [completed]
  workflow_dispatch:
    inputs:
      output_only:
        description: "Render and inspect only; do not upload"
        required: true
        type: boolean
        default: false
      privacy_status:
        description: "Visibility for the first test upload"
        required: true
        type: choice
        options:
          - private
          - unlisted
          - public
        default: public
      source_filter:
        description: "Optional manual filename filter; leave blank for automatic round-robin selection of all new and unfinished Drive videos"
        required: false
        type: string
        default: ""
      uploads_per_run:
        description: "Number of Shorts to process"
        required: true
        type: number
        default: 1

permissions:
  actions: read
  contents: write

concurrency:
  group: curioloop-fancam-drive-upload
  cancel-in-progress: false

jobs:
  process-drive-inbox:
    # Fancams have their own five daily schedule; do not create extra uploads
    # from the artist-intro workflow completion event.
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore the exact artist-intro handoff
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: curioloop-artist-intro-handoff
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: intro_handoff

      - name: Install the triggering intro handoff
        if: github.event_name == 'workflow_run'
        run: |
          test -s intro_handoff/artist_intro_fancam_queue.json
          mkdir -p history
          cp intro_handoff/artist_intro_fancam_queue.json history/artist_intro_fancam_queue.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Wait five minutes after the artist intro
        if: github.event_name == 'workflow_run'
        run: sleep 300

      - name: Load the exact source selected for the artist intro
        if: github.event_name == 'workflow_run'
        run: |
          test -f history/artist_intro_fancam_queue.json
          SOURCE_ID="$(jq -r '.drive_file_id // empty' history/artist_intro_fancam_queue.json)"
          INTRO_START="$(jq -r '.intro_footage_start // empty' history/artist_intro_fancam_queue.json)"
          INTRO_END="$(jq -r '.intro_footage_end // empty' history/artist_intro_fancam_queue.json)"
          test -n "$SOURCE_ID"
          test -n "$INTRO_START"
          test -n "$INTRO_END"
          echo "FANCAMVERSE_COORDINATED_SOURCE_ID=$SOURCE_ID" >> "$GITHUB_ENV"
          echo "FANCAMVERSE_INTRO_SOURCE_START=$INTRO_START" >> "$GITHUB_ENV"
          echo "FANCAMVERSE_INTRO_SOURCE_END=$INTRO_END" >> "$GITHUB_ENV"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Validate restored and CurioLoop scripts
        run: python -m py_compile fancamverse.py curioloop_fancam.py

      - name: Verify CurioLoop OAuth identity, then read Drive and upload
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          FANCAMVERSE_CLIENT_ID: ${{ secrets.FANCAMVERSE_CLIENT_ID }}
          FANCAMVERSE_CLIENT_SECRET: ${{ secrets.FANCAMVERSE_CLIENT_SECRET }}
          FANCAMVERSE_REFRESH_TOKEN: ${{ secrets.FANCAMVERSE_REFRESH_TOKEN }}
          FANCAMVERSE_DRIVE_FOLDER_ID: ${{ secrets.FANCAMVERSE_DRIVE_FOLDER_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          FANCAMVERSE_CHANNEL_BRAND: CurioLoop
          FANCAMVERSE_EXPECTED_CHANNEL_TITLE: CurioLoop
          FANCAMVERSE_EXCLUDE_ARTISTS: 김채원,chaewon
          FANCAMVERSE_WORK_DIR: work_curioloop_fancam
          FANCAMVERSE_HISTORY_FILE: history/curioloop_fancam_processed.json
          FANCAMVERSE_OUTPUT_ONLY: ${{ inputs.output_only || false }}
          FANCAMVERSE_SOURCE_FILTER: ${{ inputs.source_filter || '' }}
          FANCAMVERSE_UPLOADS_PER_RUN: ${{ inputs.uploads_per_run || '1' }}
          FANCAMVERSE_TRIGGER_EVENT: ${{ github.event_name }}
          FANCAMVERSE_TRIGGER_SCHEDULE: ${{ github.event.schedule || '' }}
          FANCAMVERSE_PRIVACY_STATUS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_run') && 'public' || inputs.privacy_status || 'private' }}
          FANCAMVERSE_PUBLISH_TIME_KST: ${{ (github.event.schedule == '0 15 * * *' && '00:00' || (github.event.schedule == '0 17 * * *' && '02:00' || (github.event.schedule == '15 17 * * *' && '02:00' || (github.event.schedule == '0 19 * * *' && '04:00' || (github.event.schedule == '0 1 * * *' && '10:00' || (github.event.schedule == '0 11 * * *' && '20:00' || '')))))) }}
        run: python curioloop_fancam.py

      - name: Save CurioLoop preview videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curioloop-fancam-test-videos
          path: work_curioloop_fancam/*_short_*.mp4
          if-no-files-found: ignore
          retention-days: 7

      - name: Clear the coordinated source after successful follow-up
        if: success() && github.event_name == 'workflow_run'
        run: rm -f history/artist_intro_fancam_queue.json

      - name: Persist CurioLoop upload progress
        if: always()
        run: |
          if [ -f history/curioloop_fancam_processed.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add history/curioloop_fancam_processed.json history/artist_intro_fancam_queue.json 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "Record CurioLoop Drive fancam progress"
              pushed=false
              for attempt in 1 2 3; do
                git fetch origin main
                git rebase origin/main
                if git push origin HEAD:main; then
                  pushed=true
                  break
                fi
                echo "History push attempt $attempt was rejected; rebasing on the latest main."
              done
              if [ "$pushed" != true ]; then
                echo "::error::Fancam upload may have succeeded, but history could not be persisted after three safe rebase attempts."
                exit 1
              fi
            else
              echo "No CurioLoop upload progress to persist."
            fi
          else
            echo "No CurioLoop upload history file exists."
          fi
