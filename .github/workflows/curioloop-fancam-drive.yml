name: CurioLoop Fancam Drive Upload

on:
  schedule:
    # GitHub cron is UTC. Staggered triggers run 31–82 minutes before each Korea publication slot.
    # KST publication slots: 01:00, 02:15, 03:30, 04:45, 06:00,
    # then every 2 hours from 08:00 through 00:00 (14 uploads daily).
    # Stagger away from :00 UTC to reduce GitHub schedule congestion.
    # Preserve the same 14 KST publication slots; each trigger remains ahead of its slot.
    - cron: "7 0 * * *"
    - cron: "13 2 * * *"
    - cron: "19 4 * * *"
    - cron: "23 6 * * *"
    - cron: "29 8 * * *"
    - cron: "11 10 * * *"
    - cron: "17 12 * * *"
    - cron: "23 14 * * *"
    - cron: "7 15 * * *"
    - cron: "13 16 * * *"
    - cron: "19 17 * * *"
    - cron: "23 18 * * *"
    - cron: "11 20 * * *"
    - cron: "17 22 * * *"
  workflow_dispatch:
    inputs:
      output_only:
        description: "Render and inspect only; do not upload"
        required: true
        type: boolean
        default: false
      privacy_status:
        description: "Visibility for the first test upload"
        required: true
        type: choice
        options:
          - private
          - unlisted
          - public
        default: private
      source_filter:
        description: "Optional manual filename filter; leave blank for automatic round-robin selection of all new and unfinished Drive videos"
        required: false
        type: string
        default: ""
      uploads_per_run:
        description: "Number of Shorts to process"
        required: true
        type: number
        default: 1

permissions:
  contents: write

concurrency:
  group: curioloop-fancam-drive-upload
  cancel-in-progress: false

jobs:
  process-drive-inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Validate restored and CurioLoop scripts
        run: python -m py_compile fancamverse.py curioloop_fancam.py

      - name: Read Drive and upload to CurioLoop
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          FANCAMVERSE_CLIENT_ID: ${{ secrets.FANCAMVERSE_CLIENT_ID }}
          FANCAMVERSE_CLIENT_SECRET: ${{ secrets.FANCAMVERSE_CLIENT_SECRET }}
          FANCAMVERSE_REFRESH_TOKEN: ${{ secrets.FANCAMVERSE_REFRESH_TOKEN }}
          FANCAMVERSE_DRIVE_FOLDER_ID: ${{ secrets.FANCAMVERSE_DRIVE_FOLDER_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          FANCAMVERSE_CHANNEL_BRAND: CurioLoop
          FANCAMVERSE_EXCLUDE_ARTISTS: 김채원,chaewon
          FANCAMVERSE_WORK_DIR: work_curioloop_fancam
          FANCAMVERSE_HISTORY_FILE: history/curioloop_fancam_processed.json
          FANCAMVERSE_OUTPUT_ONLY: ${{ inputs.output_only || false }}
          FANCAMVERSE_SOURCE_FILTER: ${{ inputs.source_filter || '' }}
          FANCAMVERSE_UPLOADS_PER_RUN: ${{ inputs.uploads_per_run || '1' }}
          FANCAMVERSE_PRIVACY_STATUS: public
          FANCAMVERSE_PUBLISH_TIME_KST: ${{ (github.event.schedule == '7 0 * * *' && '10:00' || (github.event.schedule == '13 2 * * *' && '12:00' || (github.event.schedule == '19 4 * * *' && '14:00' || (github.event.schedule == '23 6 * * *' && '16:00' || (github.event.schedule == '29 8 * * *' && '18:00' || (github.event.schedule == '11 10 * * *' && '20:00' || (github.event.schedule == '17 12 * * *' && '22:00' || (github.event.schedule == '23 14 * * *' && '00:00' || (github.event.schedule == '7 15 * * *' && '01:00' || (github.event.schedule == '13 16 * * *' && '02:15' || (github.event.schedule == '19 17 * * *' && '03:30' || (github.event.schedule == '23 18 * * *' && '04:45' || (github.event.schedule == '11 20 * * *' && '06:00' || (github.event.schedule == '17 22 * * *' && '08:00' || '')))))))))))))) }}
        run: python curioloop_fancam.py

      - name: Save CurioLoop preview videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curioloop-fancam-test-videos
          path: work_curioloop_fancam/*_short_*.mp4
          if-no-files-found: ignore
          retention-days: 7

      - name: Persist CurioLoop upload progress
        if: always()
        run: |
          if [ -f history/curioloop_fancam_processed.json ] && ! git diff --quiet -- history/curioloop_fancam_processed.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add history/curioloop_fancam_processed.json
            git commit -m "Record CurioLoop Drive fancam progress"
            git push
          else
            echo "No CurioLoop upload progress to persist."
          fi
